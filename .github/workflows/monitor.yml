name: Fee Monitor
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
jobs:
  check-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/monitor.spec.js
